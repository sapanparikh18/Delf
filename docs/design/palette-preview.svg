  <text x="30" y="440" font-size="16" font-weight="bold" fill="#2D2926">C: Cirque du Renard</text>
  <text x="310" y="440" font-size="12" fill="#888">Wada #164 + #313  ·  Bold &amp; Playful</text>
  <rect x="30" y="450" width="170" height="80" rx="8" fill="#DD4027"/>
  <text x="115" y="488" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Red Orange</text>
  <text x="115" y="505" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#DD4027</text>
  <rect x="210" y="450" width="170" height="80" rx="8" fill="#FCB315"/>
  <text x="295" y="488" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2926">Orange Yellow</text>
  <text x="295" y="505" text-anchor="middle" font-size="11" fill="#2D2926" opacity="0.7">#FCB315</text>
  <rect x="390" y="450" width="170" height="80" rx="8" fill="#4F4086"/>
  <text x="475" y="488" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Violet</text>
  <text x="475" y="505" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#4F4086</text>
  <rect x="570" y="450" width="170" height="80" rx="8" fill="#1A7444"/>
  <text x="655" y="488" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Diamine Green</text>
  <text x="655" y="505" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#1A7444</text>
  <rect x="30" y="535" width="240" height="24" rx="4" fill="#FFF5F0" stroke="#ddd" stroke-width="0.5"/>
