  <!-- ════════ PALETTE D ════════ -->
  <text x="30" y="605" font-size="16" font-weight="bold" fill="#2D2926">D: Les Bonbons</text>
  <text x="310" y="605" font-size="12" fill="#888">Wada #338 + #340  ·  Sweet &amp; Inviting</text>
  <rect x="30" y="615" width="170" height="80" rx="8" fill="#F37F94"/>
  <text x="115" y="653" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Eosine Pink</text>
  <text x="115" y="670" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#F37F94</text>
  <rect x="210" y="615" width="170" height="80" rx="8" fill="#FCB315"/>
  <text x="295" y="653" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2926">Orange Yellow</text>
  <text x="295" y="670" text-anchor="middle" font-size="11" fill="#2D2926" opacity="0.7">#FCB315</text>
  <rect x="390" y="615" width="170" height="80" rx="8" fill="#099197"/>
  <text x="475" y="653" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Green Blue</text>
  <text x="475" y="670" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#099197</text>
  <rect x="570" y="615" width="170" height="80" rx="8" fill="#A36AA5"/>
  <text x="655" y="653" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Aconite Violet</text>
  <text x="655" y="670" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#A36AA5</text>
  <rect x="30" y="700" width="240" height="24" rx="4" fill="#FFF5F2" stroke="#ddd" stroke-width="0.5"/>
  <text x="150" y="716" text-anchor="middle" font-size="10" fill="#2D2926">Background #FFF5F2</text>
  <rect x="280" y="700" width="240" height="24" rx="4" fill="#2D2926"/>
  <text x="400" y="716" text-anchor="middle" font-size="10" fill="#fff">Text #2D2926</text>

  <!-- Footer -->
  <text x="400" y="770" text-anchor="middle" font-size="11" fill="#aaa">All colors from Sanzo Wada · A Dictionary of Color Combinations (1933)</text>

</svg>
