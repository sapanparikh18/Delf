  <text x="680" y="110" font-size="11" fill="#fff" text-anchor="middle">
    <tspan dx="0" dy="0" fill="#E31F26" font-weight="bold" font-size="13">★ RECOMMENDED</tspan>
  </text>
  <rect x="30" y="120" width="170" height="80" rx="8" fill="#FCB315"/>
  <text x="115" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2926">Orange Yellow</text>
  <text x="115" y="175" text-anchor="middle" font-size="11" fill="#2D2926" opacity="0.7">#FCB315</text>
  <rect x="210" y="120" width="170" height="80" rx="8" fill="#E31F26"/>
  <text x="295" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Spectrum Red</text>
  <text x="295" y="175" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#E31F26</text>
  <rect x="390" y="120" width="170" height="80" rx="8" fill="#00B49B"/>
  <text x="475" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Sea Green</text>
  <text x="475" y="175" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#00B49B</text>
  <rect x="570" y="120" width="170" height="80" rx="8" fill="#A36AA5"/>
  <text x="655" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Aconite Violet</text>
  <text x="655" y="175" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#A36AA5</text>
  <!-- BG strip -->
  <rect x="30" y="205" width="240" height="24" rx="4" fill="#FFF8ED" stroke="#ddd" stroke-width="0.5"/>
  <text x="150" y="221" text-anchor="middle" font-size="10" fill="#2D2926">Background #FFF8ED</text>
  <rect x="280" y="205" width="240" height="24" rx="4" fill="#2D2926"/>
  <text x="400" y="221" text-anchor="middle" font-size="10" fill="#fff">Text #2D2926</text>

  <!-- ════════ PALETTE B ════════ -->
  <text x="30" y="275" font-size="16" font-weight="bold" fill="#2D2926">B: Jardin de Rémi</text>
  <text x="310" y="275" font-size="12" fill="#888">Wada #333 + #306  ·  Fresh &amp; Natural</text>
  <rect x="30" y="285" width="170" height="80" rx="8" fill="#006EB8"/>
  <text x="115" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Blue</text>
  <text x="115" y="340" text-anchor="middle" font-size="11" fill="#fff" opacity="0.7">#006EB8</text>
  <rect x="210" y="285" width="170" height="80" rx="8" fill="#F8ED43"/>
