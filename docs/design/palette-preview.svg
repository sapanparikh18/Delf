<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="-apple-system, Helvetica, Arial, sans-serif">

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D2926">Le Petit Français — Color Palette Options</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#888">From Sanzo Wada's A Dictionary of Color Combinations</text>

  <!-- ════════ PALETTE A ════════ -->
  <text x="30" y="110" font-size="16" font-weight="bold" fill="#2D2926">A: Paris Sunshine</text>
