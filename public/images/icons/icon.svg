<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F37F94"/>
      <stop offset="100%" style="stop-color:#FCB315"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Fox face (Rémi) -->
  <g transform="translate(256,270)">
    <!-- Ears -->
    <polygon points="-90,-140 -60,-40 -30,-100" fill="#FFF5F2" opacity="0.9"/>
    <polygon points="90,-140 60,-40 30,-100" fill="#FFF5F2" opacity="0.9"/>
    <polygon points="-80,-130 -60,-60 -40,-100" fill="#F37F94" opacity="0.6"/>
    <polygon points="80,-130 60,-60 40,-100" fill="#F37F94" opacity="0.6"/>
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="95" ry="85" fill="#FFF5F2"/>
    <!-- Eyes -->
    <circle cx="-30" cy="-15" r="14" fill="#2D2926"/>
    <circle cx="30" cy="-15" r="14" fill="#2D2926"/>
    <circle cx="-25" cy="-20" r="5" fill="#FFFFFF"/>
    <circle cx="35" cy="-20" r="5" fill="#FFFFFF"/>
    <!-- Nose -->
    <ellipse cx="0" cy="15" rx="12" ry="9" fill="#2D2926"/>
    <!-- Mouth -->
    <path d="M-15,25 Q0,40 15,25" fill="none" stroke="#2D2926" stroke-width="3" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-55" cy="10" r="15" fill="#F37F94" opacity="0.3"/>
    <circle cx="55" cy="10" r="15" fill="#F37F94" opacity="0.3"/>
  </g>
  <!-- Text -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="42" fill="#FFFFFF" letter-spacing="1">RÉMI</text>
</svg>
